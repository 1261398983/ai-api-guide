name: Probe relay status

on:
  schedule:
    # 每 30 分钟探测一次（GitHub 的 cron 可能有几分钟延迟，正常）
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: status-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run probe
        run: node scripts/probe.mjs

      - name: Commit result
        run: |
          git config user.name "status-bot"
          git config user.email "status-bot@users.noreply.github.com"
          git add data/history.json
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "status: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
